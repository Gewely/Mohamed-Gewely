<!doctype html>
<html lang="en">
<head>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<style>
:root{--r:#eb0a1e;--b:#050505;--w:#fff;--g:#aaa}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Arial,sans-serif;background:#fff;color:#111}button{font:inherit}.nav{position:sticky;top:0;z-index:80;height:68px;padding:0 28px;display:flex;align-items:center;gap:22px;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-bottom:1px solid #eee}.brand{font-weight:900;font-size:18px}.brand b{background:var(--r);color:#fff;padding:7px 9px;margin-right:8px}.nav a{font-size:13px;color:#555;text-decoration:none}.nav .sp{flex:1}.price{font-size:12px}.btn{border:0;background:var(--r);color:#fff;padding:12px 18px;font-weight:800;cursor:pointer}.hero{height:92vh;min-height:650px;position:relative;overflow:hidden;background:#060606}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(.92) contrast(1.08)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.84),rgba(0,0,0,.22) 58%,rgba(0,0,0,.12)),linear-gradient(0deg,rgba(0,0,0,.72),transparent 48%)}.heroCopy{position:absolute;z-index:2;left:6vw;bottom:9vh;color:white;max-width:950px}.k{font-size:10px;letter-spacing:.21em;text-transform:uppercase;font-weight:800}.hero h1{font-size:clamp(58px,8vw,128px);line-height:.81;letter-spacing:-.075em;margin:14px 0 25px}.story{padding:90px 5vw;background:#fff}.story h2{font-size:clamp(44px,6vw,86px);font-weight:500;letter-spacing:-.06em;margin:8px 0 32px}.storyGrid{display:grid;grid-template-columns:1.15fr .85fr;gap:24px}.card{min-height:560px;position:relative;overflow:hidden;background:#111}.card img{width:100%;height:100%;object-fit:cover;filter:saturate(.8)}.card:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.82),transparent 60%)}.cap{position:absolute;z-index:2;left:28px;bottom:28px;color:#fff}.cap h3{font-size:34px;margin:8px 0}.shift{min-height:560px;background:#09090a;color:#fff;display:grid;place-items:center;text-align:center;padding:32px}.gear{width:300px;height:300px;border:1px solid #333;border-radius:50%;display:grid;place-items:center;position:relative;margin:30px auto}.gear strong{font-size:96px;color:var(--r)}.gear span{position:absolute;color:#666}.gear .a{top:20px}.gear .b{right:28px}.gear .c{bottom:20px}.gear .d{left:28px}.gr{height:330vh;background:#050505;position:relative}.stage{height:100vh;min-height:680px;position:sticky;top:0;overflow:hidden;background:#050505;color:#fff}.bg{position:absolute;inset:-5%;width:110%;height:110%;object-fit:cover;filter:brightness(.48) saturate(1.1);transform:scale(1.08)}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.96) 0,rgba(0,0,0,.62) 36%,rgba(0,0,0,.08) 67%,rgba(0,0,0,.55)),linear-gradient(0deg,rgba(0,0,0,.9),transparent 55%)}.lights{position:absolute;z-index:6;top:11%;left:50%;transform:translateX(-50%);display:flex;gap:12px}.lights i{width:16px;height:16px;border-radius:50%;background:var(--r);opacity:.12}.scan{position:absolute;z-index:5;top:0;bottom:0;left:-20%;width:16%;background:linear-gradient(90deg,transparent,rgba(235,10,30,.4),#fff,rgba(235,10,30,.7),transparent);mix-blend-mode:screen;opacity:0}.copy{position:absolute;z-index:8;left:5vw;bottom:12vh;width:min(720px,58vw)}.phase{position:absolute;left:0;bottom:0;opacity:0;transform:translateY(26px)}.p1{opacity:1;transform:none}.copy h2{font-size:clamp(60px,7vw,118px);line-height:.8;letter-spacing:-.075em;margin:12px 0 22px}.copy em{font-style:normal;color:var(--r)}.copy p{max-width:540px;color:#c6c6ca;font-size:17px;line-height:1.5}.meta{position:absolute;right:36px;bottom:36px;z-index:7;display:flex;border-top:1px solid #444;border-bottom:1px solid #444}.meta span{padding:11px 16px;border-right:1px solid #333;font-size:9px;letter-spacing:.15em}.meta span:last-child{border-right:0}.prog{position:absolute;z-index:8;left:36px;bottom:31px;width:180px;height:2px;background:#333}.prog i{display:block;width:0;height:100%;background:var(--r)}.edge{position:absolute;right:-72px;top:43%;z-index:3;transform:rotate(90deg);font-weight:900;font-size:120px;letter-spacing:-.07em;color:rgba(255,255,255,.05)}.gate{position:absolute;z-index:20;inset:0;background:#fff;color:#111;transform:translateY(100%);display:flex;align-items:flex-end;padding:0 5vw 70px}.gate h3{font-size:clamp(46px,6vw,82px);font-weight:500;letter-spacing:-.055em;margin:6px 0}.grades{padding:85px 5vw 120px}.grades h2{font-size:clamp(46px,6vw,82px);font-weight:500;letter-spacing:-.055em;margin:8px 0 36px}.grade{max-width:680px;background:#fff0f1;border-radius:26px;padding:28px}.grade img{width:100%;height:320px;object-fit:cover;border-radius:18px;margin:20px 0}.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.specs span{background:#fff;padding:15px;border-radius:14px;font-size:11px}.specs b{display:block;font-size:20px;margin-bottom:4px}.cta{min-height:70vh;background:#080808;color:#fff;display:grid;place-items:center;text-align:center;padding:50px}.cta h2{font-size:clamp(58px,8vw,112px);line-height:.84;letter-spacing:-.07em;margin:0 0 25px}.cta em{color:var(--r);font-style:normal}@media(max-width:800px){.nav a,.price{display:none}.nav{padding:0 16px}.heroCopy{left:22px;right:22px}.hero h1{font-size:clamp(56px,17vw,90px)}.story{padding:65px 18px}.storyGrid{grid-template-columns:1fr}.card,.shift{min-height:440px}.gr{height:300vh}.bg{object-position:58% center}.copy{left:20px;right:20px;width:auto;bottom:126px}.copy h2{font-size:clamp(50px,15vw,75px)}.copy p{font-size:13px;max-width:360px}.meta{left:20px;right:20px;bottom:60px}.meta span{flex:1;text-align:center;padding:9px 5px}.prog{left:20px;bottom:27px;width:120px}.edge{font-size:86px;right:-62px}.grades{padding:65px 18px}.grade img{height:220px}.specs{grid-template-columns:1fr 1fr 1fr}.gate{padding:0 22px 60px}}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useLayoutEffect}=React;gsap.registerPlugin(ScrollTrigger);
const IMG='https://images.dailyrevs.com/0000/v3/Toyota/63bbf7529059d2d1bd729f90/2022-gr-86-premium-track-red-toyota-dwkyyweeeeb0fj6md69med4.jpeg';
function App(){useLayoutEffect(()=>{const ctx=gsap.context(()=>{gsap.from('.heroCopy>*',{y:35,opacity:0,stagger:.09,duration:.8,ease:'power3.out'});const tl=gsap.timeline({scrollTrigger:{trigger:'.gr',start:'top top',end:'bottom bottom',scrub:.8}});tl.to('.lights i',{opacity:1,boxShadow:'0 0 28px rgba(235,10,30,.95)',stagger:.055,duration:.18}).to('.lights i',{opacity:.06,duration:.08}).to('.scan',{x:'820%',opacity:1,duration:.19},'<').to('.scan',{opacity:0,duration:.03}).to('.bg',{scale:1,filter:'brightness(.72) saturate(1.14)',duration:.24},'<').to('.p1',{opacity:0,y:-26,duration:.08}).to('.p2',{opacity:1,y:0,duration:.1}).to('.bg',{scale:1.13,xPercent:4,duration:.26},'<').to('.p2',{opacity:0,y:-26,duration:.08}).to('.p3',{opacity:1,y:0,duration:.1}).to('.bg',{scale:1.22,xPercent:8,duration:.2},'<').to('.prog i',{width:'100%',duration:.55},.33).to('.gate',{y:'0%',duration:.12},.88);});return()=>ctx.revert()},[]);
return <><header className="nav"><div className="brand"><b>GR</b>86</div><a href="#story">Story</a><a href="#gr">GR DNA</a><a href="#grades">Grades</a><div className="sp"/><span className="price">Starting from AED 162,900</span><button className="btn">Build</button></header>
<section className="hero"><img src={IMG}/><div className="heroCopy"><div className="k">Toyota Gazoo Racing</div><h1>PURE SPORTS CAR.<br/>PURE CONNECTION.</h1><button className="btn">Book Test Drive</button></div></section>
<section className="story" id="story"><div className="k" style={{color:'#eb0a1e'}}>MODEL STORY</div><h2>Shift the story.</h2><div className="storyGrid"><div className="card"><img src={IMG}/><div className="cap"><small>03 / BALANCED</small><h3>Balanced by design.</h3><p>Natural, predictable handling.</p></div></div><div className="shift"><div><div className="k">CHOOSE A GEAR</div><div className="gear"><strong>4</strong><span className="a">1</span><span className="b">3</span><span className="c">6</span><span className="d">2</span></div><p style={{color:'#777'}}>MODEL STORY · DRIVING EXPERIENCE</p></div></div></div></section>
<section className="gr" id="gr"><div className="stage"><img className="bg" src={IMG}/><div className="shade"/><div className="lights">{[1,2,3,4,5].map(n=><i key={n}/>)}</div><div className="scan"/><div className="edge">RACING</div><div className="copy"><div className="phase p1"><div className="k">01 / START LINE</div><h2>BORN FROM<br/><em>COMPETITION.</em></h2><p>A cinematic GR brand moment inside the MLP — not another generic feature section.</p></div><div className="phase p2"><div className="k">02 / UNDER PRESSURE</div><h2>DEVELOPED<br/><em>AT SPEED.</em></h2><p>The car, light and track pressure become the story while scroll controls the performance film.</p></div><div className="phase p3"><div className="k">03 / ROAD READY</div><h2>BUILT FOR<br/><em>THE ROAD.</em></h2><p>The sequence finishes fast and hands the user directly back to the commercial journey.</p></div></div><div className="meta"><span>GR86</span><span>RWD</span><span>2.4L</span><span>6-SPEED</span></div><div className="prog"><i/></div><div className="gate"><div><small style={{color:'#eb0a1e'}}>AVAILABLE GRADES</small><h3>Explore the Petrol Range</h3></div></div></div></section>
<section className="grades" id="grades"><small style={{color:'#eb0a1e'}}>AVAILABLE GRADES</small><h2>Explore the Petrol Range</h2><article className="grade"><h3>2.4L GR86</h3><p>From AED 162,900</p><div className="specs"><span><b>2.4L</b>Engine</span><span><b>RWD</b>Drivetrain</span><span><b>6-speed</b>Automatic</span></div><img src={IMG}/><button className="btn">Build</button></article></section>
<section className="cta"><div><small>GR86</small><h2>DRIVE IT.<br/><em>DON'T JUST READ IT.</em></h2><button className="btn">Book a Test Drive</button></div></section></>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
