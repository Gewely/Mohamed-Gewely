<style>
:root{--r:#eb0a1e;--b:#050505;--w:#fff;--m:#a9a9af}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Arial,sans-serif;color:#111;background:#fff}.nav{position:sticky;top:0;z-index:50;height:68px;display:flex;align-items:center;gap:22px;padding:0 28px;background:rgba(255,255,255,.95);backdrop-filter:blur(15px);border-bottom:1px solid #eee}.brand{font-weight:900}.brand b{background:var(--r);color:#fff;padding:6px 8px;margin-right:8px}.nav a{font-size:13px;color:#555;text-decoration:none}.nav .spacer{flex:1}.btn{border:0;background:var(--r);color:#fff;padding:12px 18px;font-weight:800}.hero{height:92vh;min-height:650px;position:relative;overflow:hidden;background:#060606}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.9) contrast(1.06)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.78),rgba(0,0,0,.16) 55%,rgba(0,0,0,.18)),linear-gradient(0deg,rgba(0,0,0,.8),transparent 45%)}.hero-copy{position:absolute;z-index:2;left:6vw;bottom:9vh;color:white}.k{font-size:11px;letter-spacing:.2em;text-transform:uppercase}.hero h1,.gr-copy h2{font-size:clamp(58px,8vw,130px);line-height:.82;letter-spacing:-.075em;margin:14px 0 24px}.story{padding:90px 5vw;background:#fff}.story h2{font-size:clamp(42px,6vw,86px);font-weight:500;letter-spacing:-.06em;margin:10px 0 30px}.story-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:24px}.story-card{min-height:540px;position:relative;overflow:hidden;background:#111}.story-card img{width:100%;height:100%;object-fit:cover}.story-card:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent 55%)}.story-card .cap{position:absolute;z-index:2;left:28px;bottom:26px;color:#fff}.shift{min-height:540px;background:#0a0a0b;color:white;padding:32px;display:grid;place-items:center;text-align:center}.gear{width:290px;height:290px;border:1px solid #333;border-radius:50%;display:grid;place-items:center;position:relative}.gear:before{content:"4";font-size:84px;font-weight:900;color:var(--r)}.gear span{position:absolute;font-size:14px;color:#777}.gear .a{top:18px}.gear .b{right:25px}.gear .c{bottom:18px}.gear .d{left:25px}.gr{height:330vh;background:var(--b);position:relative}.gr-stage{height:100vh;min-height:680px;position:sticky;top:0;overflow:hidden;background:radial-gradient(circle at 72% 25%,rgba(235,10,30,.18),transparent 25%),#050505;color:white}.gr-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.58) saturate(1.1);transform:scale(1.1)}.gr-v{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.94) 0,rgba(0,0,0,.62) 35%,rgba(0,0,0,.08) 68%,rgba(0,0,0,.55) 100%),linear-gradient(0deg,rgba(0,0,0,.9),transparent 55%)}.lights{position:absolute;top:11%;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:5}.lights i{width:16px;height:16px;border-radius:50%;background:var(--r);opacity:.15}.scan{position:absolute;z-index:4;top:0;bottom:0;width:15%;left:-20%;background:linear-gradient(90deg,transparent,rgba(235,10,30,.5),white,rgba(235,10,30,.6),transparent);mix-blend-mode:screen;opacity:0}.gr-copy{position:absolute;z-index:6;left:5vw;bottom:11vh;width:min(670px,55vw)}.gr-copy .phase{position:absolute;left:0;bottom:0;opacity:0;transform:translateY(25px)}.gr-copy .phase:first-child{opacity:1;transform:none}.gr-copy h2 em{font-style:normal;color:var(--r)}.gr-copy p{max-width:520px;color:#c7c7ca;font-size:17px;line-height:1.5}.meta{position:absolute;right:35px;bottom:34px;z-index:6;display:flex;border-top:1px solid #444;border-bottom:1px solid #444}.meta span{padding:11px 15px;border-right:1px solid #333;font-size:9px;letter-spacing:.14em}.progress{position:absolute;left:35px;bottom:30px;width:170px;height:2px;background:#333;z-index:7}.progress i{display:block;width:0;height:100%;background:var(--r)}.whitegate{position:absolute;inset:0;background:white;z-index:20;transform:translateY(100%);display:flex;align-items:flex-end;padding:0 5vw 70px;color:#111}.whitegate h3{font-size:clamp(42px,6vw,80px);font-weight:500;letter-spacing:-.055em;margin:5px 0}.grades{padding:80px 5vw 120px}.grades h2{font-size:clamp(44px,6vw,80px);font-weight:500;letter-spacing:-.055em}.grade{max-width:650px;background:#fff1f2;border-radius:26px;padding:28px}.grade img{width:100%;border-radius:18px;margin:20px 0}.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.specs span{background:white;padding:16px;border-radius:14px;font-size:12px}.specs b{display:block;font-size:20px;margin-bottom:4px}.cta{min-height:70vh;background:#080808;color:#fff;display:grid;place-items:center;text-align:center;padding:50px}.cta h2{font-size:clamp(54px,8vw,110px);line-height:.85;letter-spacing:-.07em;margin:0 0 25px}.cta em{color:var(--r);font-style:normal}@media(max-width:800px){.nav a{display:none}.story-grid{grid-template-columns:1fr}.story-card,.shift{min-height:440px}.gr-copy{left:20px;right:20px;width:auto;bottom:120px}.gr-copy h2{font-size:clamp(50px,15vw,74px)}.gr-copy p{font-size:13px;max-width:360px}.meta{left:20px;right:20px;bottom:58px}.meta span{flex:1;text-align:center;padding:9px 5px}.progress{left:20px;bottom:26px}.gr-bg{object-position:62% center}.hero-copy{left:22px;right:22px}.hero h1{font-size:clamp(58px,17vw,88px)}}

<body><div id="root"></div><script type="module">
import React,{useLayoutEffect,useRef} from 'react';import{createRoot}from'react-dom/client';import gsap from'gsap';import{ScrollTrigger}from'gsap/ScrollTrigger';gsap.registerPlugin(ScrollTrigger);
const A='https://images.dailyrevs.com/0000/v3/Toyota/63bbf7529059d2d1bd729f90/2022-gr-86-premium-track-red-toyota-dwkyyweeeeb0fj6md69med4.jpeg?asset=';
function App(){const root=useRef(null);useLayoutEffect(()=>{const ctx=gsap.context(()=>{const tl=gsap.timeline({scrollTrigger:{trigger:'.gr',start:'top top',end:'bottom bottom',scrub:.8}});tl.to('.lights i',{opacity:1,boxShadow:'0 0 26px rgba(235,10,30,.9)',stagger:.06,duration:.15}).to('.lights i',{opacity:.08,duration:.08}).to('.scan',{x:'800%',opacity:1,duration:.18},'<').to('.scan',{opacity:0,duration:.03}).to('.gr-bg',{scale:1,filter:'brightness(.78) saturate(1.15)',duration:.22},'<').to('.p1',{opacity:0,y:-25,duration:.08}).to('.p2',{opacity:1,y:0,duration:.10}).to('.gr-bg',{scale:1.12,xPercent:4,duration:.26},'<').to('.p2',{opacity:0,y:-25,duration:.08}).to('.p3',{opacity:1,y:0,duration:.10}).to('.gr-bg',{scale:1.22,xPercent:8,duration:.20},'<').to('.progress i',{width:'100%',duration:.55},.35).to('.whitegate',{y:'0%',duration:.12},.88)});return()=>ctx.revert()},[]);return <><header className="nav"><div className="brand"><b>GR</b>86</div><a href="#story">Story</a><a href="#gr">GR DNA</a><a href="#grades">Grades</a><div className="spacer"/><span>Starting from AED 162,900</span><button className="btn">Build</button></header><section className="hero"><img src={A+'hero.jpg'}/><div className="hero-copy"><div className="k">Toyota Gazoo Racing</div><h1>PURE SPORTS CAR.<br/>PURE CONNECTION.</h1><button className="btn">Book Test Drive</button></div></section><section className="story" id="story"><div className="k" style={{color:'#eb0a1e'}}>MODEL STORY</div><h2>Shift the story.</h2><div className="story-grid"><div className="story-card"><img src={A+'story.jpg'}/><div className="cap"><small>03 / BALANCED</small><h3>Balanced by design.</h3><p>Natural, predictable handling.</p></div></div><div className="shift"><div><div className="k">CHOOSE A GEAR</div><div className="gear"><span className="a">1</span><span className="b">3</span><span className="c">6</span><span className="d">2</span></div><p style={{color:'#777'}}>MODEL STORY · DRIVING EXPERIENCE</p></div></div></div></section><section className="gr" id="gr"><div className="gr-stage"><img className="gr-bg" src={A+'grdna.jpg'}/><div className="gr-v"/><div className="lights">{[1,2,3,4,5].map(x=><i key={x}/>)}</div><div className="scan"/><div className="gr-copy"><div className="phase p1"><div className="k">01 / START LINE</div><h2>BORN FROM<br/><em>COMPETITION.</em></h2><p>A cinematic GR brand moment inside the MLP — no fake technical dashboard, no duplicate hero.</p></div><div className="phase p2"><div className="k">02 / UNDER PRESSURE</div><h2>DEVELOPED<br/><em>AT SPEED.</em></h2><p>The car, light, velocity and track pressure become the story. The page behaves like a performance film controlled by scroll.</p></div><div className="phase p3"><div className="k">03 / ROAD READY</div><h2>BUILT FOR<br/><em>THE ROAD.</em></h2><p>The experience resolves quickly and releases the customer back into the commercial MLP journey.</p></div></div><div className="meta"><span>GR86</span><span>RWD</span><span>2.4L</span><span>6-SPEED</span></div><div className="progress"><i/></div><div className="whitegate"><div><small style={{color:'#eb0a1e'}}>AVAILABLE GRADES</small><h3>Explore the Petrol Range</h3></div></div></div></section><section className="grades" id="grades"><small style={{color:'#eb0a1e'}}>AVAILABLE GRADES</small><h2>Explore the Petrol Range</h2><article className="grade"><h3>2.4L GR86</h3><p>From AED 162,900</p><div className="specs"><span><b>2.4L</b>Engine</span><span><b>RWD</b>Drivetrain</span><span><b>6-speed</b>Automatic</span></div><img src={A+'grade.jpg'}/><button className="btn">Build</button></article></section><section className="cta"><div><small>GR86</small><h2>DRIVE IT.<br/><em>DON'T JUST READ IT.</em></h2><button className="btn">Book a Test Drive</button></div></section></>}
createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
